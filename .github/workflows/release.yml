# Publish a GitHub release when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
# Runs the tests and lint first, then builds Launchpad95.zip and creates the release with the
# CHANGELOG.md section of that version as its notes. See "Releasing" in README.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::tag '$TAG' is not of the form v<version>"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release_notes.sh "$VERSION" > notes.md && cat notes.md

      - name: Build Launchpad95.zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build_release.sh "$VERSION" . && unzip -l Launchpad95.zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" Launchpad95.zip --title "Launchpad95 $VERSION" --notes-file notes.md --verify-tag
